name: Build Launcher APK

on:
  repository_dispatch:
    types: [build_apk]

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Process Images (Base64 to PNG)
        run: |
          mkdir -p app/src/main/res/drawable
          mkdir -p app/src/main/assets
          
          # Converte a logo base64 para o arquivo .png e substitui no Android
          python -c "import base64; open('app/src/main/res/drawable/logo.png', 'wb').write(base64.b64decode('${{ github.event.client_payload.logo_b64 }}'))"
          
          # Se o wallpaper foi enviado, converte também
          if [ -n "${{ github.event.client_payload.wallpaper_b64 }}" ]; then
            python -c "import base64; open('app/src/main/res/drawable/wallpaper.png', 'wb').write(base64.b64decode('${{ github.event.client_payload.wallpaper_b64 }}'))"
          fi

      - name: Set App Name
        run: |
          # Substitui o nome do aplicativo no arquivo strings.xml
          sed -i 's/<string name="app_name">.*<\/string>/<string name="app_name">${{ github.event.client_payload.app_name }}<\/string>/g' app/src/main/res/values/strings.xml || true

      - name: Set Reseller ID
        run: |
          # Cria o arquivo rid.txt para vincular o painel do revendedor
          echo "${{ github.event.client_payload.reseller_id }}" > app/src/main/assets/rid.txt

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build Release APK
        run: ./gradlew assembleRelease

      - name: Rename APK for consistent URL
        run: |
          # Renomeia o APK gerado para garantir que a URL final seja exata e padronizada
          mv app/build/outputs/apk/release/*.apk app/build/outputs/apk/release/CustomApp.apk

      - name: Upload Release to GitHub
        id: create_release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: "v${{ github.run_id }}"
          name: "APK - ${{ github.event.client_payload.app_name }}"
          files: app/build/outputs/apk/release/CustomApp.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Notify Panel (Success)
        if: success()
        run: |
          # Gera a URL de download e envia de volta para o painel via API
          DOWNLOAD_URL="https://github.com/${{ github.repository }}/releases/download/v${{ github.run_id }}/CustomApp.apk"
          
          curl -X POST "${{ github.event.client_payload.panel_url }}?action=set_rebrand_link&reseller_id=${{ github.event.client_payload.reseller_id }}" -H "Content-Type: application/json" -d "{\"link\":\"$DOWNLOAD_URL\"}"
          
          curl -X POST "${{ github.event.client_payload.panel_url }}?action=set_rebrand_status&reseller_id=${{ github.event.client_payload.reseller_id }}" -H "Content-Type: application/json" -d "{\"status\":\"done\"}"

      - name: Notify Panel (Failure)
        if: failure()
        run: |
          # Se der erro no build, avisa o painel para liberar o botão e mostrar a falha
          curl -X POST "${{ github.event.client_payload.panel_url }}?action=set_rebrand_status&reseller_id=${{ github.event.client_payload.reseller_id }}" -H "Content-Type: application/json" -d "{\"status\":\"error\"}"
