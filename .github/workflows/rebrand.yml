<?php
// Arquivo: api.php

require 'database.php'; // Instancia o $pdo

header('Content-Type: application/json');

$action = $_GET['action'] ?? '';
$ADM_EMAIL = "panthervpn@gmail.com";

// Lê o JSON do corpo (para requisições POST)
$body = json_decode(file_get_contents('php://input'), true) ?? [];

// Helper para resposta JSON
function json_response($data, $status = 200) {
    http_response_code($status);
    echo json_encode($data);
    exit;
}

// ==== HELPERS DO BANCO DE DADOS ====

function get_kv($pdo, $key) {
    $stmt = $pdo->prepare("SELECT value FROM kv WHERE key = ?");
    $stmt->execute([$key]);
    return $stmt->fetchColumn() ?: null;
}

function put_kv($pdo, $key, $value) {
    $stmt = $pdo->prepare("INSERT INTO kv (key, value) VALUES (?, ?) ON CONFLICT(key) DO UPDATE SET value = excluded.value");
    $stmt->execute([$key, $value]);
}

function get_all_resellers($pdo) {
    $stmt = $pdo->query("SELECT username, data_json FROM resellers");
    $resellers = [];
    while ($row = $stmt->fetch(PDO::FETCH_ASSOC)) {
        $resellers[$row['username']] = json_decode($row['data_json'], true);
    }
    // Garante que o admin exista
    if (!isset($resellers['admin'])) {
        $resellers['admin'] = ['role' => 'admin', 'credits' => 9999999, 'parent' => null, 'app_id' => 'ADMIN'];
        save_reseller($pdo, 'admin', $resellers['admin']);
    }
    return $resellers;
}

function save_reseller($pdo, $username, $data) {
    $stmt = $pdo->prepare("INSERT INTO resellers (username, data_json) VALUES (?, ?) ON CONFLICT(username) DO UPDATE SET data_json = excluded.data_json");
    $stmt->execute([$username, json_encode($data)]);
}

function save_all_resellers($pdo, $resellers) {
    foreach ($resellers as $user => $data) {
        save_reseller($pdo, $user, $data);
    }
}

function find_reseller_by_email($resellers, $email) {
    $e = strtolower(trim($email ?? ''));
    foreach ($resellers as $k => $data) {
        if (strtolower($data['google_email'] ?? '') === $e) return $k;
    }
    return null;
}

function is_reseller_or_parent_expired($pdo, $username, $resellers) {
    if (!$username || $username === 'admin') return false;
    $current = $username;
    $guard = 0;
    while ($current && $current !== 'admin' && $guard < 100) {
        $guard++;
        $data = $resellers[$current] ?? null;
        if (!$data) return true;
        if (!empty($data['blocked'])) return true;
        if (!empty($data['expires_at']) && (time() * 1000) > $data['expires_at']) return true;
        $current = $data['parent'] ?? null;
    }
    return false;
}

// Retorna autenticação (Simula o checkAuth do Worker)
function check_auth($pdo) {
    $email = strtolower(trim($_SERVER['HTTP_X_GOOGLE_EMAIL'] ?? ''));
    if (!$email) return null;
    $resellers = get_all_resellers($pdo);
    $user = find_reseller_by_email($resellers, $email);
    if (!$user) return null;
    return [
        'user' => $user,
        'role' => $resellers[$user]['role'] ?? 'reseller',
        'data' => $resellers[$user],
        'resellers' => $resellers
    ];
}

