// 1. VALIDAÇÃO DO APP NA TV
if ($action === 'validate') {
    $code = trim($_GET['code'] ?? '');
    $deviceId = trim($_GET['deviceId'] ?? '');
    $appIdValidate = strtoupper(trim($_GET['appid'] ?? 'ADMIN'));
    
    $valid = false; $limitReached = false; $exp = 0; $act = 0; $blocked = false;

    if ($code) {
        $stmt = $pdo->prepare("SELECT code, exp, act, blocked, screenLimit, creator FROM codes WHERE code = ?");
        $stmt->execute([$code]);
        $row = $stmt->fetch(PDO::FETCH_ASSOC);

        if (!$row) {
            $resellersTest = get_all_resellers($pdo);
            $testUntil = 0;
            foreach ($resellersTest as $rk => $rData) {
                if (($rData['app_id'] ?? '') !== $appIdValidate) continue;
                $tm = $rData['test_mode'] ?? null;
                if ($tm && isset($tm['until']) && $tm['until'] > (time() * 1000) && $tm['until'] > $testUntil) {
                    $testUntil = $tm['until'];
                }
            }
            if ($testUntil > 0) { http_response_code(200); echo "VALID:$testUntil:0"; exit; }
        } else {
            $creator = $row['creator'] ?: 'admin';
            if ($creator !== 'admin') {
                $resellers = get_all_resellers($pdo);
                if (is_reseller_or_parent_expired($pdo, $creator, $resellers)) {
                    http_response_code(200); echo "BLOCKED"; exit;
                }
            }
            $exp = (int)$row['exp'];
            $act = (int)$row['act'];
            $blocked = (bool)$row['blocked'];
            $screenLimit = max(1, (int)$row['screenLimit']);
            $nowMs = time() * 1000;

            if (!$blocked && ($exp === 0 || $exp > $nowMs)) {
                if (!$deviceId) {
                    $valid = true;
                    if (!$act) { $act = $nowMs; $pdo->prepare("UPDATE codes SET act = ? WHERE code = ?")->execute([$act, $code]); }
                } else {
                    $pdo->prepare("DELETE FROM sessions WHERE last_seen < ?")->execute([$nowMs - (30 * 24 * 3600 * 1000)]);
                    $sStmt = $pdo->prepare("SELECT device_id, last_seen FROM sessions WHERE code = ?");
                    $sStmt->execute([$code]);
                    $sessions = [];
                    while ($sRow = $sStmt->fetch(PDO::FETCH_ASSOC)) { $sessions[$sRow['device_id']] = $sRow['last_seen']; }

                    $dirty = false;
                    if (isset($sessions[$deviceId])) {
                        if (($nowMs - $sessions[$deviceId]) > (24 * 3600 * 1000)) { $sessions[$deviceId] = $nowMs; $dirty = true; }
                        $valid = true;
                    } else {
                        if (count($sessions) < $screenLimit) { $sessions[$deviceId] = $nowMs; $valid = true; $dirty = true; } 
                        else { $limitReached = true; }
                    }
                    if ($dirty) $pdo->prepare("INSERT INTO sessions (code, device_id, last_seen) VALUES (?, ?, ?) ON CONFLICT(code, device_id) DO UPDATE SET last_seen = excluded.last_seen")->execute([$code, $deviceId, $nowMs]);
                    if (!$act) { $act = $nowMs; $pdo->prepare("UPDATE codes SET act = ? WHERE code = ?")->execute([$act, $code]); }
                }
            }
        }
    }
    if ($blocked) { http_response_code(200); echo "BLOCKED"; exit; }
    if ($limitReached) { http_response_code(403); echo "Limite de telas atingido"; exit; }
    http_response_code(200); echo $valid ? "VALID:$exp:$act" : "INVALID"; exit;
}

// 2. STATUS MODO TESTE (APP)
if ($action === 'testmode_status') {
    $appIdStatus = trim($_GET['appid'] ?? 'ADMIN');
    $resellers = get_all_resellers($pdo);
