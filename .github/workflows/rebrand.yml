name: Rebrand APK

on:
  repository_dispatch:
    types: [build_apk]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Instalar dependencias
        run: |
          sudo apt-get update
          sudo apt-get install -y zipalign apksigner imagemagick

      - name: Instalar apktool 2.9.3
        run: |
          wget -q https://raw.githubusercontent.com/iBotPeaches/Apktool/master/scripts/linux/apktool -O apktool
          wget -q https://github.com/iBotPeaches/Apktool/releases/download/v2.9.3/apktool_2.9.3.jar
          chmod +x apktool
          sudo mv apktool /usr/local/bin/apktool
          sudo mv apktool_2.9.3.jar /usr/local/bin/apktool.jar

      - name: Extrair base.apk
        run: apktool d -s base.apk -o app_extraido

      - name: Injetar Nome, Logo e Wallpaper
        env:
          RESELLER_ID: ${{ github.event.client_payload.reseller_id }}
          APP_NAME: ${{ github.event.client_payload.app_name }}
          LOGO_URL: ${{ github.event.client_payload.logo_url }}
          WALLPAPER_URL: ${{ github.event.client_payload.wallpaper_url }}
        run: |
          set -e
          sed -i "s|<string name=\"app_name\">[^<]*</string>|<string name=\"app_name\">${APP_NAME}</string>|" app_extraido/res/values/strings.xml
          mkdir -p app_extraido/assets/assets
          echo -n "$RESELLER_ID" > app_extraido/assets/assets/rid.txt
          echo -n "$RESELLER_ID" > app_extraido/assets/rid.txt
          if [ -n "$LOGO_URL" ]; then
            wget -q -O raw_logo "$LOGO_URL"
            convert raw_logo -resize 150x150 -background none -gravity center -extent 192x192 PNG32:nova_logo.png
            convert raw_logo -resize 150x150 -background none -gravity center -extent 192x192 webp:nova_logo.webp 2>/dev/null || cp nova_logo.png nova_logo.webp
            find app_extraido/res -name "ic_launcher*.png" -exec cp nova_logo.png {} \;
            find app_extraido/res -name "ic_launcher*.webp" -exec cp nova_logo.webp {} \;
          fi
          if [ -n "$WALLPAPER_URL" ]; then
            wget -q -O wallpaper_custom "$WALLPAPER_URL"
            convert wallpaper_custom -resize 1200x896^ -gravity center -extent 1200x896 -quality 90 JPG:app_extraido/res/drawable/wallpaper_blue.jpg
          fi

      - name: Compilar, alinhar e assinar
        run: |
          set -e
          apktool b app_extraido -o app_unaligned.apk
          zipalign -f 4 app_unaligned.apk app_aligned.apk
          apksigner sign --ks release.jks --ks-pass pass:123456 --out app_final.apk app_aligned.apk

      - name: Publicar no GitHub Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USER: panthervpn
          GITHUB_REPO: PoupaLauncher
          RESELLER_ID: ${{ github.event.client_payload.reseller_id }}
          APP_NAME: ${{ github.event.client_payload.app_name }}
        run: |
          set -e
          SAFE_NAME=$(echo "$APP_NAME" | sed 's/[^A-Za-z0-9._-]\+/_/g')
          if [ -z "$SAFE_NAME" ]; then SAFE_NAME="app"; fi
          FINAL_APK="${SAFE_NAME}.apk"
          cp app_final.apk "$FINAL_APK"
          TAG="rebrand-$RESELLER_ID"
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --title "$TAG" --notes "APK rebrand $RESELLER_ID"
          gh release upload "$TAG" "$FINAL_APK" --clobber

      - name: Reportar link ao Painel
        env:
          API_URL: https://poupalauncher.alwaysdata.net/api.php
          REBRAND_TOKEN: ${{ secrets.REBRAND_TOKEN }}
          RESELLER_ID: ${{ github.event.client_payload.reseller_id || 'ADMIN' }}
          GITHUB_USER: panthervpn
          GITHUB_REPO: PoupaLauncher
          APP_NAME: ${{ github.event.client_payload.app_name }}
        run: |
          SAFE_NAME=$(echo "$APP_NAME" | sed 's/[^A-Za-z0-9._-]\+/_/g')
          if [ -z "$SAFE_NAME" ]; then SAFE_NAME="app"; fi
          LINK="https://github.com/${GITHUB_USER}/${GITHUB_REPO}/releases/download/rebrand-${RESELLER_ID}/${SAFE_NAME}.apk"
          
          curl -s -X POST -H "X-Auth-Token: $REBRAND_TOKEN" -H "Content-Type: application/json" \
            -d "{\"reseller_id\":\"${RESELLER_ID}\",\"link\":\"${LINK}\"}" \
            "$API_URL?action=set_rebrand_link&reseller_id=$RESELLER_ID"
            
          curl -s -X POST -H "X-Auth-Token: $REBRAND_TOKEN" -H "Content-Type: application/json" \
            -d "{\"reseller_id\":\"${RESELLER_ID}\",\"status\":\"done\"}" \
            "$API_URL?action=set_rebrand_status&reseller_id=$RESELLER_ID"
