// 5. CRIAR CÓDIGO DE ACESSO
if ($action === 'add' && $_SERVER['REQUEST_METHOD'] === 'POST') {
    $code = trim($body['code'] ?? '');
    $hours = (float)($body['hours'] ?? 0);
    $name = trim($body['name'] ?? '');
    $screens = max(1, (int)($body['screens'] ?? 1));

    if (!$code) json_response(['error' => 'Codigo vazio'], 400);
    if ($hours <= 0) json_response(['error' => 'Validade invalida'], 400);

    if (!$IS_ADMIN) {
        if (is_reseller_or_parent_expired($pdo, $ME, $resellers)) {
            json_response(['error' => 'Seu painel esta vencido. Renove para criar acessos.'], 403);
        }
        $baseCost = $hours <= 12 ? 0 : ceil($hours / 720);
        $extraScreensCost = max(0, $screens - 2);
        $cost = $baseCost + ($extraScreensCost * ($baseCost === 0 ? 1 : $baseCost));

        $isUnlimited = ($resellers[$ME]['credits'] ?? 0) >= 9999;
        if (!$isUnlimited) {
            if (($resellers[$ME]['credits'] ?? 0) < $cost) {
                json_response(['error' => "Creditos insuficientes. Custo: $cost credito(s)."], 400);
            }
            $resellers[$ME]['credits'] -= $cost;
        }
        save_all_resellers($pdo, $resellers);
    }

    $exp = (time() * 1000) + round($hours * 3600000);
    $nowMs = time() * 1000;
    
    $stmt = $pdo->prepare("INSERT INTO codes (code, exp, act, blocked, name, screenLimit, creator, created_at) VALUES (?, ?, 0, 0, ?, ?, ?, ?) ON CONFLICT(code) DO UPDATE SET exp = excluded.exp, act = 0, blocked = 0, name = excluded.name, screenLimit = excluded.screenLimit, creator = excluded.creator, created_at = COALESCE(codes.created_at, excluded.created_at)");
    
    $stmt->execute([$code, $exp, $name, $screens, $IS_ADMIN ? 'admin' : $ME, $nowMs]);
    
    json_response(['ok' => true, 'exp' => $exp]);
}

// 6. DELETAR CÓDIGO
if ($action === 'del' && $_SERVER['REQUEST_METHOD'] === 'POST') {
    $code = trim($body['code'] ?? '');
    $stmt = $pdo->prepare("SELECT creator FROM codes WHERE code = ?");
    $stmt->execute([$code]);
    $row = $stmt->fetch(PDO::FETCH_ASSOC);
    if ($row && !$IS_ADMIN && $row['creator'] !== $ME) json_response(['error' => 'Sem permissao para este codigo'], 403);
    
    $pdo->prepare("DELETE FROM codes WHERE code = ?")->execute([$code]);
    $pdo->prepare("DELETE FROM sessions WHERE code = ?")->execute([$code]);
    json_response(['ok' => true]);
}

// 7. BLOQUEAR / DESBLOQUEAR CÓDIGO
if (($action === 'block' || $action === 'unblock') && $_SERVER['REQUEST_METHOD'] === 'POST') {
    $code = trim($body['code'] ?? '');
    $stmt = $pdo->prepare("SELECT creator FROM codes WHERE code = ?");
    $stmt->execute([$code]);
    $row = $stmt->fetch(PDO::FETCH_ASSOC);
    if (!$row) json_response(['error' => 'Codigo nao encontrado'], 404);
    if (!$IS_ADMIN && $row['creator'] !== $ME) json_response(['error' => 'Sem permissao para este codigo'], 403);
    
    $newBlocked = ($action === 'block') ? 1 : 0;
    $pdo->prepare("UPDATE codes SET blocked = ? WHERE code = ?")->execute([$newBlocked, $code]);
    json_response(['ok' => true, 'blocked' => (bool)$newBlocked]);
}

// 8. ALTERAR DIAS DO CÓDIGO (Gerenciando saldo de crédito)
if ($action === 'setdays' && $_SERVER['REQUEST_METHOD'] === 'POST') {
    $code = trim($body['code'] ?? '');
    $days = (int)($body['days'] ?? 0);
    if ($days <= 0) json_response(['error' => 'Quantidade de dias invalida'], 400);
    
    $stmt = $pdo->prepare("SELECT exp, screenLimit, creator FROM codes WHERE code = ?");
    $stmt->execute([$code]);
    $row = $stmt->fetch(PDO::FETCH_ASSOC);
    if (!$row) json_response(['error' => 'Codigo nao encontrado'], 404);
    if (!$IS_ADMIN && $row['creator'] !== $ME) json_response(['error' => 'Sem permissao'], 403);

    if (!$IS_ADMIN) {
        if (is_reseller_or_parent_expired($pdo, $ME, $resellers)) json_response(['error' => 'Seu painel esta vencido.'], 403);
        $currentDays = 0; $nowMs = time() * 1000;
        if ($row['exp'] > $nowMs) $currentDays = ceil(($row['exp'] - $nowMs) / 86400000);
        
        $diff = $days - $currentDays;
        $baseCost = 0;
        if ($diff > 0) $baseCost = ceil($diff / 30);
        else if ($diff < 0) $baseCost = -floor(abs($diff) / 30);

        $extraScreens = max(0, $row['screenLimit'] - 2);
        $cost = $baseCost + ($extraScreens * $baseCost);

        $isUnlimited = ($resellers[$ME]['credits'] ?? 0) >= 9999;
        if (!$isUnlimited) {
            if ($cost > 0 && ($resellers[$ME]['credits'] ?? 0) < $cost) json_response(['error' => 'Creditos insuficientes na sua conta.'], 400);
            $resellers[$ME]['credits'] -= $cost;
            save_all_resellers($pdo, $resellers);
        }
    }
    $newExp = (time() * 1000) + ($days * 86400000);
    $pdo->prepare("UPDATE codes SET exp = ? WHERE code = ?")->execute([$newExp, $code]);
    json_response(['ok' => true, 'exp' => $newExp]);
}

// 9. ALTERAR LIMITE DE TELAS
if ($action === 'setlimit' && $_SERVER['REQUEST_METHOD'] === 'POST') {
    $code = trim($body['code'] ?? '');
    $screens = max(1, (int)($body['screens'] ?? 1));
    
    $stmt = $pdo->prepare("SELECT exp, screenLimit, creator FROM codes WHERE code = ?");
    $stmt->execute([$code]);
    $row = $stmt->fetch(PDO::FETCH_ASSOC);
    if (!$row) json_response(['error' => 'Codigo nao encontrado'], 404);
    if (!$IS_ADMIN && $row['creator'] !== $ME) json_response(['error' => 'Sem permissao'], 403);

    if (!$IS_ADMIN) {
        if (is_reseller_or_parent_expired($pdo, $ME, $resellers)) json_response(['error' => 'Seu painel esta vencido.'], 403);
        $oldScreens = $row['screenLimit'];
        $extraScreensToPay = 0;
        if ($screens > 2 && $screens > $oldScreens) {
           $alreadyPaidExtras = max(0, $oldScreens - 2);
           $newExtras = $screens - 2;
           $extraScreensToPay = $newExtras - $alreadyPaidExtras;
        }
        if ($extraScreensToPay > 0) {
           $remainingDays = 0; $nowMs = time() * 1000;
           if ($row['exp'] > $nowMs) $remainingDays = ceil(($row['exp'] - $nowMs) / 86400000);
           $baseCost = $remainingDays <= 0 ? 1 : ceil($remainingDays / 30);
           $cost = $extraScreensToPay * $baseCost;
           
           $isUnlimited = ($resellers[$ME]['credits'] ?? 0) >= 9999;
           if (!$isUnlimited) {
             if (($resellers[$ME]['credits'] ?? 0) < $cost) json_response(['error' => "Creditos insuficientes para adicionar telas. Custo: $cost"], 400);
             $resellers[$ME]['credits'] -= $cost;
             save_all_resellers($pdo, $resellers);
           }
        }
    }
    $pdo->prepare("UPDATE codes SET screenLimit = ? WHERE code = ?")->execute([$screens, $code]);
    json_response(['ok' => true, 'screenLimit' => $screens]);
}

// 10. CRIAR CONVITE DE REVENDA
if ($action === 'create_reseller_invite' && $_SERVER['REQUEST_METHOD'] === 'POST') {
    $days = (float)($body['days'] ?? 0);
    $credits = (int)($body['credits'] ?? 0);
    $name = trim($body['name'] ?? '');

    $costDays = $days >= 1 ? ceil($days / 30) : 0;
    $isUnlimited = $IS_ADMIN || (($resellers[$ME]['credits'] ?? 0) >= 9999);
    
    if ($days == 0 && !$isUnlimited) json_response(['success' => false, 'error' => 'Apenas ilimitados podem criar painel vitalício.'], 403);

    if (!$IS_ADMIN && !$isUnlimited) {
        if (is_reseller_or_parent_expired($pdo, $ME, $resellers)) json_response(['success' => false, 'error' => 'Seu painel esta vencido.'], 403);
        $totalCost = $credits + $costDays;
        if (($resellers[$ME]['credits'] ?? 0) < $totalCost) json_response(['success' => false, 'error' => "Créditos insuficientes. Custo: $totalCost."], 400);
        $resellers[$ME]['credits'] -= $totalCost;
    }

    $baseUser = $name ? preg_replace('/[^a-z0-9]/i', '', strtolower(iconv('UTF-8', 'ASCII//TRANSLIT', $name))) : 'pendente';
    if (!$baseUser) $baseUser = 'pendente';
    
    $finalUser = $baseUser;
    $counter = 1;
    while (isset($resellers[$finalUser])) { $finalUser = $baseUser . $counter; $counter++; }

    $appId = strtoupper(substr(md5(uniqid()), 0, 8));
    $expiresAt = $days > 0 ? (time() * 1000) + ($days * 86400000) : null;
    $token = substr(md5(uniqid()), 0, 10) . base_convert(time(), 10, 36);

    $resellers[$finalUser] = [
        'password' => substr(md5(uniqid()), 0, 8), 'role' => 'reseller', 'credits' => $credits,
        'parent' => $ME, 'app_id' => $appId, 'created_at' => time() * 1000,
        'expires_at' => $expiresAt, 'label' => $name ?: 'Pendente (Aguardando Login)', 'pending_invite' => $token,
    ];
    save_all_resellers($pdo, $resellers);
    put_kv($pdo, "invite_$token", json_encode(['creator' => $ME, 'username' => $finalUser, 'used' => false]));
    json_response(['success' => true, 'token' => $token]);
}

// 11. GERENCIAR CRÉDITOS E DIAS DA REVENDA
if ($action === 'set_credits' && $_SERVER['REQUEST_METHOD'] === 'POST') {
    $target = trim($body['target'] ?? '');
    $value = (int)($body['value'] ?? 0);
    
    if (!$target || $value < 0) json_response(['success' => false, 'error' => 'Dados invalidos'], 400);
    if (!isset($resellers[$target])) json_response(['success' => false, 'error' => 'Revendedor nao encontrado'], 404);
    if (($resellers[$target]['parent'] ?? null) !== $ME && !$IS_ADMIN) json_response(['success' => false, 'error' => 'Nao autorizado'], 403);

    $oldValue = $resellers[$target]['credits'] ?? 0;
    $diff = $value - $oldValue;

    if (!$IS_ADMIN) {
        $isUnlimited = ($resellers[$ME]['credits'] ?? 0) >= 9999;
        if (is_reseller_or_parent_expired($pdo, $ME, $resellers)) json_response(['success' => false, 'error' => 'Painel vencido.'], 403);
        if (!$isUnlimited) {
            if ($diff > 0 && ($resellers[$ME]['credits'] ?? 0) < $diff) json_response(['success' => false, 'error' => 'Creditos insuficientes'], 400);
            $resellers[$ME]['credits'] -= $diff;
        }
    }
    $resellers[$target]['credits'] = $value;
    save_all_resellers($pdo, $resellers);
    json_response(['success' => true]);
}

if ($action === 'add_reseller_days' && $_SERVER['REQUEST_METHOD'] === 'POST') {
    $target = trim($body['target'] ?? '');
    $addDays = (float)($body['days'] ?? 0);
    
    if (!$target || $addDays < 0) json_response(['success' => false, 'error' => 'Dados invalidos'], 400);
    if (!isset($resellers[$target])) json_response(['success' => false, 'error' => 'Nao encontrado'], 404);
    if (($resellers[$target]['parent'] ?? null) !== $ME && !$IS_ADMIN) json_response(['success' => false, 'error' => 'Nao autorizado'], 403);

    $isUnlimited = $IS_ADMIN || (($resellers[$ME]['credits'] ?? 0) >= 9999);
    if ($addDays == 0 && !$isUnlimited) json_response(['success' => false, 'error' => 'Apenas ilimitados podem definir como vitalício.'], 403);

    if (!$IS_ADMIN && !$isUnlimited) {
        $costDays = $addDays >= 1 ? ceil($addDays / 30) : 0;
        if (($resellers[$ME]['credits'] ?? 0) < $costDays) json_response(['success' => false, 'error' => "Créditos insuficientes"], 400);
        $resellers[$ME]['credits'] -= $costDays;
    }

    if ($addDays == 0) { $resellers[$target]['expires_at'] = null; } 
    else {
        $currentExp = $resellers[$target]['expires_at'] ?? (time() * 1000);
        if ($currentExp < (time() * 1000)) $currentExp = (time() * 1000);
        $resellers[$target]['expires_at'] = $currentExp + ($addDays * 86400000);
    }
    save_all_resellers($pdo, $resellers);
    json_response(['success' => true]);
}

if (($action === 'block_reseller' || $action === 'unblock_reseller') && $_SERVER['REQUEST_METHOD'] === 'POST') {
