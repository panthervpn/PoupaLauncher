// ==== TODAS AS ROTAS ABAIXO EXIGEM LOGIN (checkAuth) ====
$auth = check_auth($pdo);
if (!$auth && !in_array($action, ['validate', 'testmode_status', 'get_apk_update', 'set_apk_update', 'telegram_webhook'])) {
