// 3. OBTER CRÉDITOS DO LOGADO
if ($action === 'get_credits') {
    json_response(['success' => true, 'credits' => $auth['data']['credits'] ?? 0]);
}

// 4. LISTAR REVENDEDORES (Para o Dashboard não travar)
if ($action === 'get_resellers') {
    $filtered = [];
    foreach ($resellers as $k => $data) {
        if ($k === 'admin') continue;
        if ($IS_ADMIN || ($data['parent'] ?? null) === $ME) {
