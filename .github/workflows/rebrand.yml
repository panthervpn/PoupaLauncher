// 1. LOGIN COM GOOGLE (Exatamente igual a lógica do Cloudflare)
if ($action === 'google_auth') {
    $email = trim($_GET['email'] ?? '');
    $sub = trim($_GET['sub'] ?? '');
    $name = $_GET['name'] ?? '';
    $picture = $_GET['picture'] ?? '';
    $inviteToken = $_GET['invite'] ?? '';
    $deviceId = trim($_GET['deviceId'] ?? '');
    $appIdLink = strtoupper(trim($_GET['appid'] ?? ''));

    if (!$email || !$sub) json_response(['success' => false, 'error' => 'Dados invalidos do Google'], 400);

    $resellers = get_all_resellers($pdo);

    // Se é o admin master
    if (strtolower($email) === strtolower($ADM_EMAIL)) {
        $resellers['admin']['google_email'] = $email;
        $resellers['admin']['google_sub'] = $sub;
        $resellers['admin']['google_name'] = $name ?: 'Administrador';
        $resellers['admin']['google_picture'] = $picture;
        save_reseller($pdo, 'admin', $resellers['admin']);

        json_response([
            'success' => true, 'user' => 'admin', 'role' => 'admin', 'credits' => 9999999, 'parent' => null,
            'app_id' => 'ADMIN', 'expires_at' => null, 'display_name' => $name ?: 'Administrador', 'photo' => $picture,
            'dashboard_banner' => $resellers['admin']['dashboard_banner'] ?? '',
            'dashboard_background' => $resellers['admin']['dashboard_background'] ?? ''
        ]);
    }

    // Já existe a conta?
    $existing = find_reseller_by_email($resellers, $email);
    if ($existing) {
        $resellers[$existing]['google_sub'] = $sub;
        if ($name) $resellers[$existing]['google_name'] = $name;
        if ($picture) $resellers[$existing]['google_picture'] = $picture;
        save_reseller($pdo, $existing, $resellers[$existing]);

        $exp = $resellers[$existing]['expires_at'] ?? null;
        if (is_reseller_or_parent_expired($pdo, $existing, $resellers)) $exp = 1;

        json_response([
            'success' => true, 'user' => $existing, 'role' => $resellers[$existing]['role'] ?? 'reseller',
            'credits' => $resellers[$existing]['credits'], 'parent' => $resellers[$existing]['parent'],
            'app_id' => $resellers[$existing]['app_id'] ?? 'ADMIN', 'expires_at' => $exp,
            'display_name' => $resellers[$existing]['google_name'] ?? $existing,
            'photo' => $resellers[$existing]['google_picture'] ?? '',
            'dashboard_banner' => $resellers[$existing]['dashboard_banner'] ?? '',
            'dashboard_background' => $resellers[$existing]['dashboard_background'] ?? ''
        ]);
    }

    // Processamento de Convite
    if ($inviteToken) {
        $invStr = get_kv($pdo, "invite_$inviteToken");
        $inv = $invStr ? json_decode($invStr, true) : null;
        if ($inv && empty($inv['used']) && isset($resellers[$inv['creator']])) {
            $finalUser = $inv['username'];
            $gName = $name ?: $finalUser;
            
            $resellers[$finalUser]['password'] = substr($sub, 0, 8);
            $resellers[$finalUser]['google_email'] = $email;
            $resellers[$finalUser]['google_sub'] = $sub;
            $resellers[$finalUser]['google_name'] = $gName;
            $resellers[$finalUser]['google_picture'] = $picture;
            unset($resellers[$finalUser]['pending_invite']);
            
            $inv['used'] = true;
            $inv['used_by'] = $email;
            put_kv($pdo, "invite_$inviteToken", json_encode($inv));
            save_all_resellers($pdo, $resellers);

            $expInvite = $resellers[$finalUser]['expires_at'] ?? null;
            if (is_reseller_or_parent_expired($pdo, $finalUser, $resellers)) $expInvite = 1;

            json_response([
                'success' => true, 'user' => $finalUser, 'role' => 'reseller',
                'credits' => $resellers[$finalUser]['credits'], 'parent' => $resellers[$finalUser]['parent'],
                'app_id' => $resellers[$finalUser]['app_id'], 'expires_at' => $expInvite,
                'display_name' => $gName, 'photo' => $picture
            ]);
        }
    }

    // Auto-teste (Login sem convite se o Admin ativou)
    $autoRaw = get_kv($pdo, 'autotest_config');
    $autoCfg = $autoRaw ? json_decode($autoRaw, true) : null;
    $testMinutes = ($autoCfg && ($autoCfg['minutes'] ?? 0) > 0 && ($autoCfg['until'] ?? 0) > (time() * 1000)) ? $autoCfg['minutes'] : 0;
    
    if ($testMinutes > 0) {
        $base = preg_replace('/[^a-z0-9]/i', '', strtolower(explode('@', $email)[0]));
        $newUser = $base ?: 'user';
        $n = 1;
        while (isset($resellers[$newUser])) { $newUser = $base . $n; $n++; }
        
        $resellers[$newUser] = [
            'password' => substr($sub, 0, 8), 'role' => 'reseller', 'test_account' => true,
            'credits' => 9999999, 'parent' => 'admin', 'app_id' => strtoupper(substr(md5(uniqid()), 0, 8)),
            'created_at' => time() * 1000, 'expires_at' => (time() * 1000) + ($testMinutes * 60000),
            'google_email' => $email, 'google_sub' => $sub, 'google_name' => $name ?: $newUser, 'google_picture' => $picture,
        ];
        save_all_resellers($pdo, $resellers);
        json_response([
            'success' => true, 'user' => $newUser, 'role' => 'reseller', 'credits' => 9999999,
            'parent' => 'admin', 'app_id' => $resellers[$newUser]['app_id'], 'expires_at' => $resellers[$newUser]['expires_at'],
            'display_name' => $name ?: $newUser, 'photo' => $picture
        ]);
    }

    json_response(['success' => false, 'error' => 'Conta não vinculada. Peça seu link de revendedor e tente novamente.'], 401);
}

// ==========================================
// ============ ROTAS PÚBLICAS ==============
