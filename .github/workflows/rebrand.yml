if ($action === 'restore_backup' && $_SERVER['REQUEST_METHOD'] === 'POST') {
    if (!isset($_FILES['backup_file']) || $_FILES['backup_file']['error'] !== UPLOAD_ERR_OK) {
        json_response(['error' => 'Erro ao receber o arquivo no servidor.'], 400);
    }

    $input = file_get_contents($_FILES['backup_file']['tmp_name']);
    
    if (strlen($input) < 32 || substr($input, 0, 4) !== 'PLB1') {
        json_response(['error' => 'O arquivo nao possui o formato valido de backup.'], 400);
    }
    
    $iv = substr($input, 4, 12);
    $tag = substr($input, -16);
    $cipher = substr($input, 16, -16);
    
    $key1 = hash('sha256', 'BackupPoupalauncher2026', true);
    $decrypted = openssl_decrypt($cipher, 'aes-256-gcm', $key1, OPENSSL_RAW_DATA, $iv, $tag);
    
    if ($decrypted === false) {
        $key2 = hash('sha256', '17out1986', true);
        $decrypted = openssl_decrypt($cipher, 'aes-256-gcm', $key2, OPENSSL_RAW_DATA, $iv, $tag);
    }
    
    if ($decrypted === false) {
        json_response(['error' => 'A senha interna de descriptografia nao confere.'], 400);
    }
    
    // Extração agressiva: Pega estritamente do primeiro "{" ou "[" até o último "}" ou "]"
    $startObj = strpos($decrypted, '{');
    $startArr = strpos($decrypted, '[');
    $start = false;
    if ($startObj !== false && $startArr !== false) $start = min($startObj, $startArr);
    else if ($startObj !== false) $start = $startObj;
    else if ($startArr !== false) $start = $startArr;

    $endObj = strrpos($decrypted, '}');
    $endArr = strrpos($decrypted, ']');
    $end = false;
    if ($endObj !== false && $endArr !== false) $end = max($endObj, $endArr);
    else if ($endObj !== false) $end = $endObj;
    else if ($endArr !== false) $end = $endArr;

    if ($start !== false && $end !== false && $end >= $start) {
        $decrypted = substr($decrypted, $start, $end - $start + 1);
    }

    $data = json_decode($decrypted, true);
    
    if (json_last_error() !== JSON_ERROR_NONE) {
        json_response(['error' => 'Erro ao converter JSON interno: ' . json_last_error_msg()], 400);
    }
    
    $myAppId = strtoupper($auth['data']['app_id'] ?? ($ME === 'admin' ? 'ADMIN' : ''));
    $backupAppId = strtoupper(trim($data['app_id'] ?? ''));

    if ($backupAppId && $myAppId && $backupAppId !== $myAppId && !$IS_ADMIN) {
        json_response(['error' => 'Este backup pertence a outro App ID (' . $backupAppId . ').'], 403);
    }

    if (isset($data['revenda']) && $data['revenda'] !== $ME && !$IS_ADMIN) {
        $isDescendant = false;
        $cur = $data['revenda'];
        while ($cur && isset($resellers[$cur])) {
            if (($resellers[$cur]['parent'] ?? '') === $ME) { $isDescendant = true; break; }
            $cur = $resellers[$cur]['parent'] ?? null;
        }
        if (!$isDescendant) {
            json_response(['error' => 'Este backup pertence a outro usuario (' . $data['revenda'] . ').'], 403);
        }
    }

    $restoredResellersCount = 0;
    if (isset($data['revendedores']) && is_array($data['revendedores'])) {
        $resChanged = false;
        foreach ($data['revendedores'] as $k => $resData) {
            if (!isset($resellers[$k])) {
                $resellers[$k] = $resData;
                $restoredResellersCount++;
                $resChanged = true;
            }
        }
        if ($resChanged) save_all_resellers($pdo, $resellers);
    }

    $codesList = [];
    if (isset($data['codigos']) && is_array($data['codigos'])) {
        $codesList = $data['codigos'];
    } elseif (isset($data['codes']) && is_array($data['codes'])) {
        $codesList = $data['codes'];
    } elseif (is_array($data) && isset($data[0]) && is_array($data[0])) {
        $codesList = $data;
    } else {
        json_response(['error' => 'O arquivo nao contem a lista de codigos esperada.'], 400);
    }
    
    $added = 0;
    $stmt = $pdo->prepare("INSERT OR IGNORE INTO codes (code, exp, act, blocked, name, screenLimit, creator, created_at) VALUES (?, ?, ?, ?, ?, ?, ?, ?)");
    
    foreach ($codesList as $c) {
        if (empty($c['code'])) continue;
        $code = $c['code'];
        $exp = $c['exp'] ?? 0;
        $act = $c['act'] ?? 0;
        $blocked = !empty($c['blocked']) ? 1 : 0;
        $name = $c['name'] ?? '';
        $screens = $c['screens'] ?? $c['screenLimit'] ?? 1;
        $creator = $c['creator'] ?? $ME;
        $created_at = $c['created'] ?? $c['created_at'] ?? (time() * 1000);
        
        $stmt->execute([$code, $exp, $act, $blocked, $name, $screens, $creator, $created_at]);
        if ($stmt->rowCount() > 0) $added++;
    }
    json_response(['success' => true, 'restored' => $added, 'restored_resellers' => $restoredResellersCount]);
}

