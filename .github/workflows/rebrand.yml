    foreach ($resellers as $rk => $rData) {
        if (($rData['app_id'] ?? '') !== $appIdStatus) continue;
        $tm = $rData['test_mode'] ?? null;
        if ($tm && isset($tm['until']) && $tm['until'] > $nowTm && $tm['until'] > $testUntil) {
